# Modellen in het atelier. Bijwerken na WP-02 (MoE-verificatie) en WP-03 (ijkset).

showmodel:
  naam: "Qwen2.5-32B-Instruct"
  quantisatie: "Q4_K_M"
  grootte_gb: 19
  poort: 8080
  rol: "demonstratie en vergelijking; traag en gerantsoeneerd"
  opmerking: >
    NOG ONGEWIJZIGD, maar WP-02 adviseert vervanging door het MoE-model
    (Qwen3-30B-A3B): 5,4x sneller bij gelijke grootte. Zie besluit B16, variant A.
    Dat besluit is aan de eigenaar; uitvoering hoort bij WP-03/WP-04.

klasmodel:
  naam: null                    # vullen na WP-03
  quantisatie: "Q4_K_M"
  poort: 8081
  rol: "standaard voor alle bezoekersvragen"
  advies: >
    Een dense Qwen in de 8B-klasse. Nederlands is hier doorslaggevend: de Qwen-familie
    heeft veruit de breedste meertaligheid. Zoek geen Nederlands-specifiek model --
    kleine meertalige modellen presteren daar inmiddels beter.

embeddings:
  naam: "bge-m3"
  precisie: "FP16"
  dimensies: 1024
  poort: 8082

modellenbank:
  # Module K3: dezelfde Nederlandse vraag aan vijf modellen.
  # Twee draaien live, drie komen uit conserven. Zo krijg je een vijfvoudige
  # vergelijking zonder vijf modellen tegelijk te draaien.
  live: ["klasmodel", "showmodel"]
  uit_conserven: []             # vullen na WP-03

hardware_werkelijkheid:
  bandbreedte_gb_s: 200
  toelichting: >
    Tokengeneratie is bandbreedte-gebonden, niet rekenkracht-gebonden.
    Ruwweg: tokens/s = bandbreedte / modelgrootte. Een 19 GB model haalt dus
    hooguit ongeveer 10 tok/s, een 5 GB model ongeveer 40. Dit verklaart de
    50-70 s ketenlatency volledig en is de kern van module K3.

moe_status:
  werkt_op_deze_build: true     # WP-02, gemeten 2026-09-02
  getest_met: "Qwen3-30B-A3B-Instruct-2507 Q4_K_M (18,4 GB, ~3B actief van 30B)"
  gemeten:
    tok_per_s: 35.13            # tegen 6,48 voor het dense showmodel
    p50_s: 4.32                 # tegen 24,06
    doorzet_per_min: 13.2       # tegen 2,6
  rapport: "ops/ijking/moe-verificatie-2026-09-02.md"
  toelichting: >
    Issue 19219 is gesloten als not_planned/stale, dus niet opgelost verklaard -- maar de
    oorzaak (CUDA_SCALE_LAUNCH_QUEUES uit commit a83c73a18) is met PR 19227 gereverteerd
    en zit niet meer in build 8117. Geverifieerd met strings op de binary. MoE decodeert
    normaal en is 5,4x sneller dan het dense showmodel bij gelijke bestandsgrootte.
  risico: >
    De onderliggende JetPack-fout zit nog wel op deze machine (L4T R36.4.7, exact de
    versie van de melder). Zodra een nieuwere llama.cpp de env-var herintroduceert, hangt
    MoE opnieuw. Controleer na elke upgrade:
    strings $(command -v llama-server) | grep CUDA_SCALE_LAUNCH_QUEUES
  geheugengrens: >
    Twee modellen van ~19 GB passen niet werkbaar naast elkaar: samen 47,2 GB gebruikt met
    499 MB vrij, en laden lukt alleen na drop_caches omdat NvMap geen page-cache kan
    opeisen. Zie besluit B16 (variant A) en vondst V4.
